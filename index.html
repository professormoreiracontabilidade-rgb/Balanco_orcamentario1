<script>
'use strict';
const LESSONS=[{"tag":"Fundamento legal","title":"O que é o Balanço Orçamentário?","body":"<p>O <strong>Balanço Orçamentário (BO)</strong> é a demonstração contábil do setor público que permite comparar o <strong>orçamento planejado</strong> com a <strong>execução ocorrida</strong> durante o exercício.</p><div class=\"quote\">Lei nº 4.320/1964, art. 102: <strong>“O Balanço Orçamentário demonstrará as receitas e despesas previstas em confronto com as realizadas.”</strong></div><p>Para a prova, associe imediatamente estas palavras: <strong>previsão • autorização • execução • confronto.</strong></p>","tip":"A definição legal aparece literalmente em diversas questões."},{"tag":"O raciocínio do BO","title":"Quatro informações indispensáveis","body":"<p>O Balanço Orçamentário faz duas comparações fundamentais:</p><div class=\"two-col\"><div class=\"mini\"><span class=\"kicker\">RECEITAS</span><strong>Previstas</strong><span class=\"arrow\">↓</span><strong>Realizadas (arrecadadas)</strong></div><div class=\"mini\"><span class=\"kicker\">DESPESAS</span><strong>Fixadas/autorizadas</strong><span class=\"arrow\">↓</span><strong>Executadas (empenhadas)</strong></div></div><p>Ele registra o planejamento inicial, alterações e a execução, permitindo avaliar a atuação da administração pública.</p>","tip":"A questão pode descrever o demonstrativo sem escrever seu nome."},{"tag":"Receita pública","title":"Prever não é arrecadar","body":"<p><strong>Receita prevista</strong> é a estimativa do orçamento. <strong>Receita realizada</strong>, na execução orçamentária, é a receita efetivamente arrecadada.</p><div class=\"example\"><div class=\"example-title\">Exemplo</div><div class=\"val-row\"><span>Receita prevista</span><b>R$ 1.000.000</b></div><div class=\"val-row\"><span>Receita arrecadada</span><b>R$ 930.000</b></div><div class=\"val-row sum\"><span>Insuficiência de arrecadação</span><b>R$ 70.000</b></div></div><p>Arrecadar menos do que o previsto indica insuficiência em relação à previsão — <strong>não prova, sozinho, que houve déficit orçamentário</strong>.</p>","tip":"A banca pode destacar uma receita “lançada”, mas não arrecadada."},{"tag":"Despesa pública","title":"Fixar não é empenhar","body":"<p><strong>Despesa fixada</strong> é o limite inicialmente autorizado no orçamento. <strong>Despesa empenhada</strong> representa a execução orçamentária considerada na apuração do resultado.</p><div class=\"example\"><div class=\"example-title\">Exemplo</div><div class=\"val-row\"><span>Despesa fixada</span><b>R$ 1.000.000</b></div><div class=\"val-row\"><span>Despesa empenhada</span><b>R$ 900.000</b></div><div class=\"val-row sum\"><span>Diferença nesse exemplo</span><b>R$ 100.000</b></div></div><p>Não confunda <strong>empenho</strong>, <strong>liquidação</strong> e <strong>pagamento</strong>. São etapas diferentes da despesa.</p>","tip":"A diferença acima é didática; o saldo da dotação é apurado pela dotação atualizada menos a despesa empenhada."},{"tag":"Cálculo ilustrativo","title":"Menos arrecadação pode coexistir com superávit","body":"<p>Veja os mesmos valores de uma prefeitura reunidos:</p><div class=\"example\"><div class=\"example-title\">Execução do exercício</div><div class=\"val-row\"><span>Receita arrecadada</span><b>R$ 930.000</b></div><div class=\"val-row\"><span>Despesa empenhada</span><b>R$ 900.000</b></div><div class=\"val-row sum\"><span>Resultado orçamentário</span><b class=\"positive\">+ R$ 30.000</b></div></div><div class=\"formula\">RECEITA ARRECADADA − DESPESA EMPENHADA</div><p>Embora a receita arrecadada tenha ficado R$ 70.000 abaixo da previsão, a prefeitura obteve <strong>superávit orçamentário de R$ 30.000</strong>.</p>","tip":"Insuficiência de arrecadação e déficit orçamentário são conceitos diferentes."},{"tag":"Não confunda","title":"Identifique cada demonstração contábil","body":"<div class=\"comparisons\"><div><b>Balanço Orçamentário</b><span>Previsão, autorização e execução do orçamento.</span></div><div><b>Balanço Financeiro</b><span>Ingressos e dispêndios financeiros.</span></div><div><b>Balanço Patrimonial</b><span>Ativos, passivos e patrimônio líquido.</span></div><div><b>Demonstração das Variações Patrimoniais</b><span>Variações patrimoniais e resultado patrimonial.</span></div><div><b>Demonstração dos Fluxos de Caixa</b><span>Entradas e saídas de caixa por atividades.</span></div></div>","tip":"As bancas trocam a definição de um demonstrativo pela de outro."},{"tag":"Pegadinhas","title":"Cinco armadilhas frequentes nas provas","body":"<div class=\"check-row\"><b>01</b><span>BO não demonstra <strong>somente caixa</strong> ou pagamentos.</span></div><div class=\"check-row\"><b>02</b><span>BO não se limita a <strong>bens e obrigações</strong> (isso caracteriza o enfoque patrimonial).</span></div><div class=\"check-row\"><b>03</b><span>BO não se limita a <strong>variações patrimoniais</strong>.</span></div><div class=\"check-row\"><b>04</b><span>Receita abaixo da previsão não significa, isoladamente, <strong>déficit orçamentário</strong>.</span></div><div class=\"check-row\"><b>05</b><span>Quando a banca perguntar <strong>“qual demonstração confronta valores previstos e realizados?”</strong>, reconheça o Balanço Orçamentário.</span></div>","tip":"Fique atento especialmente aos comandos INCORRETA, EXCETO e NÃO."},{"tag":"Revisão antes do quiz","title":"O que você precisa saber para acertar","body":"<div class=\"recap\"><span class=\"label\">PALAVRAS-CHAVE</span><strong>Previsão + Fixação + Execução = Balanço Orçamentário</strong></div><p>O art. 102 fala do confronto entre receitas e despesas <strong>previstas</strong> e <strong>realizadas</strong>.</p><p>Quando o enunciado mencionar apenas <strong>patrimônio</strong>, <strong>ingressos financeiros</strong> ou <strong>fluxos de caixa</strong>, analise se a banca não está descrevendo outra demonstração.</p><div class=\"ready\">Agora você está preparado para resolver as <strong>14 questões originais</strong> deste tópico!</div>","tip":"Responda sem consultar o gabarito. A resolução aparece após confirmar."}];
const QUESTIONS=[{"number":6,"banca":"IBADE - Cont (CREF 19)/CREF 19/2026","stem":"No conjunto das Demonstrações Contábeis Aplicadas ao Setor Público, cada demonstrativo tem foco específico.\n\nAssinale a alternativa correta sobre o Balanço Orçamentário.","options":[{"letter":"A","label":"Evidencia a execução do orçamento, confrontando previsão e realização das receitas e fixação e execução das despesas."},{"letter":"B","label":"Evidencia ingressos e dispêndios de caixa, incluindo saldos iniciais e finais de disponibilidades do período."},{"letter":"C","label":"Evidencia ativos, passivos e patrimônio líquido, com segregação por financeiro e permanente em base patrimonial."},{"letter":"D","label":"Evidencia variações patrimoniais aumentativas e diminutivas, com formação do resultado patrimonial do exercício."},{"letter":"E","label":"Evidencia custos por centro de responsabilidade e mede eficiência por atividade, integrando sistema de custos do órgão."}],"correct":"A","explanation":"O Balanço Orçamentário confronta a previsão e a realização das receitas e a autorização e execução das despesas. As outras alternativas tratam de demonstrações financeiras, patrimoniais ou de custos.","url":"https://www.tecconcursos.com.br/questoes/3799106"},{"number":7,"banca":"AVANÇASP - Enc (Pref Americana)/Pref Americana/Seção de Almoxarifado/2026","stem":"No âmbito da administração pública, deve-se ter noções sobre os demonstrativos que compõem a prestação de contas. Com base nas normas de contabilidade pública, assinale a alternativa CORRETA que indica o que o Balanço Orçamentário demonstra.","options":[{"letter":"A","label":"O registro de todos os bens móveis e imóveis adquiridos pela administração durante o ano."},{"letter":"B","label":"As receitas e despesas previstas em confronto com as realizadas."},{"letter":"C","label":"O resultado financeiro acumulado apenas com a venda de materiais inservíveis do estoque."},{"letter":"D","label":"A relação completa dos fornecedores que participaram de licitações no período."},{"letter":"E","label":"O valor total da dívida pública sem considerar a arrecadação de impostos do exercício."}],"correct":"B","explanation":"O artigo 102 da Lei nº 4.320/1964 determina que o Balanço Orçamentário demonstre as receitas e despesas previstas em confronto com as realizadas. É a finalidade central dessa demonstração.","url":"https://www.tecconcursos.com.br/questoes/3800805"},{"number":30,"banca":"Instituto IACP - FTrib (Pref Sta Luzia Norte)/Pref Sta Luzia Norte/2026","stem":"Sobre o Balanço Orçamentário, é CORRETO afirmar que:","options":[{"letter":"A","label":"o Balanço Orçamentário evidencia exclusivamente os ingressos e dispêndios financeiros do ente público."},{"letter":"B","label":"o Balanço Orçamentário apresenta apenas a receita arrecadada e a despesa paga, excluindo etapas como previsão, fixação e restos a pagar."},{"letter":"C","label":"o Balanço Orçamentário registra somente as despesas liquidadas, pois as despesas empenhadas não compõem sua estrutura."},{"letter":"D","label":"o Balanço Orçamentário demonstra apenas a execução das receitas intraorçamentárias e exclui as receitas correntes."},{"letter":"E","label":"o Balanço Orçamentário demonstra a execução orçamentária da receita e da despesa, confrontando valores previstos e fixados com os realizados."}],"correct":"E","explanation":"A execução orçamentária deve ser comparada com o planejamento: receitas previstas versus arrecadadas e despesas autorizadas versus executadas. O BO não se limita ao caixa, a valores pagos ou a receitas intraorçamentárias.","url":"https://www.tecconcursos.com.br/questoes/3854801"},{"number":33,"banca":"IBADE - CI (Pref Alto A Parecis)/Pref Alto A Parecis/2026","stem":"Os demonstrativos contábeis aplicados ao setor público evidenciam diferentes dimensões da gestão orçamentária, financeira e patrimonial. Para o controle interno, a correta interpretação desses demonstrativos é essencial à análise da regularidade e do desempenho da administração.\n\nConsiderando essa perspectiva, assinale a alternativa  INCORRETA.","options":[{"letter":"A","label":"O Balanço Financeiro evidencia ingressos e dispêndios de natureza financeira no exercício."},{"letter":"B","label":"O Balanço Patrimonial evidencia a composição do patrimônio, com ativos e passivos."},{"letter":"C","label":"O Balanço Orçamentário evidencia ingressos e dispêndios financeiros do exercício."},{"letter":"D","label":"A Demonstração das Variações Patrimoniais evidencia alterações no patrimônio do ente."},{"letter":"E","label":"A Demonstração dos Fluxos de Caixa evidencia entradas e saídas de caixa por atividades."}],"correct":"C","explanation":"A questão pede a alternativa INCORRETA. A afirmação sobre ingressos e dispêndios financeiros caracteriza o Balanço Financeiro, não a finalidade do Balanço Orçamentário. As demais alternativas descrevem corretamente seus demonstrativos.","url":"https://www.tecconcursos.com.br/questoes/3869040"},{"number":40,"banca":"COPEVE UFMG - Tec (UFMG)/UFMG/Contabilidade/2026","stem":"Leia o enunciado:\n\nEvidencia as receitas e as despesas orçamentárias, detalhadas em níveis relevantes de análise, confrontando o orçamento inicial, as suas alterações e a sua execução.\n\nEsse enunciado se refere ao","options":[{"letter":"A","label":"Balanço Financeiro."},{"letter":"B","label":"Balanço de Restos a Pagar."},{"letter":"C","label":"Balanço Orçamentário."},{"letter":"D","label":"Balanço Patrimonial."}],"correct":"C","explanation":"O confronto entre orçamento inicial, alterações orçamentárias e valores executados identifica o Balanço Orçamentário. O Balanço Financeiro e o Patrimonial têm finalidades diferentes.","url":"https://www.tecconcursos.com.br/questoes/3918525"},{"number":50,"banca":"IDECAN - Tec (UNILAB)/UNILAB/Contabilidade/2026","stem":"O Balanço Orçamentário é uma das demonstrações obrigatórias da contabilidade pública. Assinale a alternativa que expressa a finalidade desse balanço.","options":[{"letter":"A","label":"Comparar receitas e despesas previstas com as efetivamente realizadas."},{"letter":"B","label":"Apresentar o total dos bens móveis e imóveis do patrimônio público."},{"letter":"C","label":"Evidenciar os contratos administrativos celebrados no exercício."},{"letter":"D","label":"Registrar todas as operações patrimoniais e extraorçamentárias."}],"correct":"A","explanation":"A finalidade é comparar as receitas e despesas previstas e autorizadas com os valores efetivamente realizados na execução do orçamento, conforme a Lei nº 4.320/1964.","url":"https://www.tecconcursos.com.br/questoes/3967147"},{"number":51,"banca":"SELECON - Tec (UFRJ)/UFRJ/Contabilidade/2026","stem":"O demonstrativo da contabilidade pública que apresenta os valores das receitas previstas e realizadas, bem como os valores das dotações iniciais das despesas e das realizações ocorridas, é conhecido como:","options":[{"letter":"A","label":"balanço financeiro"},{"letter":"B","label":"balanço patrimonial"},{"letter":"C","label":"balanço orçamentário"},{"letter":"D","label":"demonstração dos fluxos de caixa"},{"letter":"E","label":"demonstração das variações patrimoniais"}],"correct":"C","explanation":"Receitas previstas e realizadas, dotações das despesas e sua execução são informações próprias do Balanço Orçamentário. A banca descreveu o demonstrativo para que o aluno o reconhecesse.","url":"https://www.tecconcursos.com.br/questoes/3984911"},{"number":52,"banca":"FUNDATEC - Tes (Pref Araquari)/Pref Araquari/2026","stem":"No âmbito das demonstrações contábeis aplicadas ao setor público, o Balanço Orçamentário apresenta informações relevantes sobre a execução do orçamento ao longo do exercício financeiro. Considerando sua finalidade e conteúdo, assinale a alternativa INCORRETA.","options":[{"letter":"A","label":"Evidencia a execução das receitas e despesas previstas em confronto com os valores efetivamente realizados, permitindo a análise do resultado orçamentário do exercício."},{"letter":"B","label":"Apresenta, entre suas informações, os valores relativos às variações patrimoniais decorrentes de fatos modificativos, com destaque para receitas e despesas sob o enfoque econômico."},{"letter":"C","label":"Permite identificar diferenças entre previsão e execução, evidenciando superávit ou déficit orçamentário conforme o comportamento das receitas e despesas."},{"letter":"D","label":"Integra o conjunto das demonstrações contábeis aplicadas ao setor público, sendo estruturado de forma a permitir a análise do desempenho da execução orçamentária."}],"correct":"B","explanation":"A alternativa pedida é a INCORRETA. As variações patrimoniais de natureza econômica são objeto da Demonstração das Variações Patrimoniais; não caracterizam o conteúdo central do Balanço Orçamentário.","url":"https://www.tecconcursos.com.br/questoes/3988807"},{"number":58,"banca":"AVANÇASP - Tes (Pref Taiúva)/Pref Taiúva/2026","stem":"Complete a lacuna com a literalidade do Art. 102 da Lei nº 4.320/1964: “O Balanço Orçamentário demonstrará as receitas e despesas previstas em confronto com as ____________.”","options":[{"letter":"A","label":"estornadas."},{"letter":"B","label":"parceladas."},{"letter":"C","label":"realizadas."},{"letter":"D","label":"canceladas."},{"letter":"E","label":"dispensadas."}],"correct":"C","explanation":"O artigo 102 da Lei nº 4.320/1964 diz: “O Balanço Orçamentário demonstrará as receitas e despesas previstas em confronto com as realizadas”. A palavra que completa a lacuna é “realizadas”.","url":"https://www.tecconcursos.com.br/questoes/4008127"},{"number":62,"banca":"ABCP - Cont (Pref Cardoso)/Pref Cardoso/2026","stem":"Ao analisar o encerramento do exercício financeiro de determinado ente público, o contador verificou que a arrecadação superou a previsão inicial da receita e que a despesa empenhada foi inferior à fixada na Lei Orçamentária Anual.\n\nPara evidenciar essa comparação entre valores previstos e executados, deve-se utilizar o demonstrativo contábil denominado:","options":[{"letter":"A","label":"Balanço Patrimonial."},{"letter":"B","label":"Balanço Financeiro."},{"letter":"C","label":"Demonstração dos Fluxos de Caixa."},{"letter":"D","label":"Balanço Orçamentário."}],"correct":"D","explanation":"Comparar arrecadação com previsão e despesas empenhadas com valores fixados é finalidade do Balanço Orçamentário. Não confunda com informações patrimoniais ou de fluxo de caixa.","url":"https://www.tecconcursos.com.br/questoes/4020659"},{"number":69,"banca":"FAFIPA - Tes (CM Campo Largo)/CM Campo Largo/2026","stem":"Ao final do exercício, determinado Município elaborou a demonstração contábil aplicada ao setor público destinada a evidenciar, de forma comparativa, as receitas previstas e realizadas, bem como as despesas fixadas e executadas no orçamento. Nos termos da Lei nº 4.320/1964 e do MCASP, essa demonstração corresponde ao:","options":[{"letter":"A","label":"Balanço Financeiro."},{"letter":"B","label":"Balanço Orçamentário."},{"letter":"C","label":"Relatório Resumido da Execução Orçamentária."},{"letter":"D","label":"Balanço Patrimonial."},{"letter":"E","label":"Demonstração das Variações Patrimoniais."}],"correct":"B","explanation":"Pela Lei nº 4.320/1964, o Balanço Orçamentário evidencia a previsão e execução de receitas e despesas. O RREO é um relatório mais abrangente e não é o nome da demonstração solicitada.","url":"https://www.tecconcursos.com.br/questoes/4074897"},{"number":84,"banca":"Instituto CONSULPAM - EEsc (Pref Pindorama)/Pref Pindorama/2026","stem":"Na contabilidade aplicada ao setor público, o registro que demonstra as receitas e despesas previstas em confronto com as realizadas ao longo do exercício financeiro é denominado como:","options":[{"letter":"A","label":"Balanço Patrimonial."},{"letter":"B","label":"Balanço Orçamentário."},{"letter":"C","label":"Balanço Financeiro."},{"letter":"D","label":"Demonstração das Variações Patrimoniais."}],"correct":"B","explanation":"O demonstrativo chamado Balanço Orçamentário confronta receitas e despesas previstas com realizadas. Esse é o conceito essencial cobrado na questão.","url":"https://www.tecconcursos.com.br/questoes/4118884"},{"number":89,"banca":"FUNDATEC - Cont (CRA RS)/CRA RS/2026","stem":"De acordo com a Lei nº 4.320/1964 e o MCASP, o Balanço Orçamentário evidencia a execução do orçamento público em determinado exercício financeiro, além de:","options":[{"letter":"A","label":"Evidenciar apenas os bens, os direitos, as obrigações e o patrimônio líquido da entidade pública ao final do exercício."},{"letter":"B","label":"Apresentar exclusivamente a movimentação financeira de caixa e equivalentes de caixa ocorrida no exercício financeiro."},{"letter":"C","label":"Demonstrar as receitas previstas e as receitas realizadas, bem como as despesas fixadas e as despesas executadas, evidenciando o resultado orçamentário do exercício."},{"letter":"D","label":"Demonstrar exclusivamente as variações patrimoniais aumentativas e diminutivas ocorridas no exercício."}],"correct":"C","explanation":"O BO permite identificar como se comportaram as receitas previstas/realizadas e as despesas fixadas/executadas, inclusive o resultado orçamentário. Não mostra exclusivamente patrimônio, caixa ou variações patrimoniais.","url":"https://www.tecconcursos.com.br/questoes/4159966"},{"number":92,"banca":"Instituto Verbena - FTrib (Pref Buriti Alegre)/Pref Buriti Alegre/2026","stem":"Ao final do exercício financeiro, uma entidade do setor público verificou que a arrecadação das receitas orçamentárias ficou inferior à previsão inicial. A demonstração contábil que evidencia o confronto entre a previsão e a execução das receitas orçamentárias recebe a denominação de","options":[{"letter":"A","label":"Demonstração de Fluxo de Caixa."},{"letter":"B","label":"Demonstração das Variações Patrimoniais."},{"letter":"C","label":"Balanço Financeiro."},{"letter":"D","label":"Balanço Orçamentário."}],"correct":"D","explanation":"Mesmo que a questão mencione apenas a arrecadação inferior à previsão, a demonstração que apresenta o confronto entre previsão e execução das receitas orçamentárias é o Balanço Orçamentário.","url":"https://www.tecconcursos.com.br/questoes/4216141"}];
const VERSION='moreira-bo01-v2';
const N=LESSONS.length, TOTAL=QUESTIONS.length, FIRST=N+1, FINAL=N+TOTAL+1;
const defaultState=()=>({stage:0,name:'',soundOn:true,answers:{},chosen:{}});
let state=defaultState();
function load(){try{let o=JSON.parse(localStorage.getItem(VERSION)||'null');if(o&&typeof o==='object'){state={...defaultState(),...o};state.stage=Math.max(0,Math.min(FINAL,Number(state.stage)||0));state.answers=state.answers||{};state.chosen=state.chosen||{};}}catch(e){}}
function save(){try{localStorage.setItem(VERSION,JSON.stringify(state));}catch(e){document.getElementById('saveStatus').textContent='O navegador não autorizou salvar o progresso.';}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scrollUp(){window.scrollTo({top:0,behavior:'instant'});}
function getQuestionIndex(){return state.stage-FIRST;}
function completed(q){return Object.prototype.hasOwnProperty.call(state.answers,String(q.number));}
function score(){return QUESTIONS.filter(q=>state.answers[q.number]===q.correct).length;}
let audioCtx;
function sound(ok){if(!state.soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioCtx=audioCtx||new A();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=ok?[{freq:523,at:0,d:.12},{freq:659,at:.12,d:.12},{freq:784,at:.24,d:.26}]:[{freq:380,at:0,d:.18},{freq:285,at:.17,d:.31}];notes.forEach(o=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(o.freq,now+o.at);gain.gain.setValueAtTime(.0001,now+o.at);gain.gain.exponentialRampToValueAtTime(.075,now+o.at+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+o.at+o.d);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+o.at);osc.stop(now+o.at+o.d+.035);});}catch(e){}}
function buttonSound(){document.getElementById('soundToggle').textContent=state.soundOn?'🔊 Som ligado':'🔇 Som desligado';}
function renderCover(){return `<article class="sheet"><div class="hero"><span class="pill">CONTABILIDADE PÚBLICA</span><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><h2>BALANÇO ORÇAMENTÁRIO</h2><p>TÓPICO 01 • Conceito, finalidade e identificação</p></div><div class="hero-foot"><div class="hero-points"><div><strong>${N}</strong><small>Telas de teoria</small></div><div><strong>${TOTAL}</strong><small>Questões do PDF</small></div><div><strong>✓</strong><small>Correção com som</small></div></div><label class="field-label" for="studentName">Nome do aluno (opcional)</label><input class="name-input" id="studentName" maxlength="80" autocomplete="name" placeholder="Digite seu nome" value="${safe(state.name)}"><p class="hint-muted">Primeiro a teoria, depois o quiz. Cada acerto fica verde; cada erro fica vermelho.</p><button class="primary" id="start" type="button">Começar a aula →</button><div class="audio-label">Teste os sons (toque para ouvir):</div><div class="audio-tests"><button class="audio-btn" id="testSuccess" type="button">🔊 Som do acerto</button><button class="audio-btn error" id="testError" type="button">🔊 Som do erro</button></div></div></article>`;}
function renderTheory(l,i){return `<article class="sheet lesson"><div class="soft-title">TEORIA • ${i+1} DE ${N} • ${safe(l.tag)}</div><div class="microline"></div><h2>${safe(l.title)}</h2><div class="lesson-content">${l.body}</div><div class="teacher-tip"><strong>💡 Dica do Professor Moreira:</strong> ${safe(l.tip)}</div></article>`;}
function renderQuestion(q,j){let answered=completed(q), chosen=state.chosen[q.number]||'', right=state.answers[q.number]===q.correct;return `<article class="sheet question"><div class="q-header"><span class="q-number">Questão ${String(q.number).padStart(2,'0')}</span><span class="q-index">${j+1} de ${TOTAL} questões</span></div><div class="banca">${safe(q.banca)}</div><p class="stem">${safe(q.stem)}</p><div class="options" role="group" aria-label="Alternativas da questão ${q.number}">${q.options.map(o=>{let className=answered?(o.letter===q.correct?'right':o.letter===chosen?'wrong':''):(o.letter===chosen?'selected':'');return `<button type="button" class="option ${className}" data-option="${o.letter}" ${answered?'disabled':''} aria-pressed="${o.letter===chosen?'true':'false'}"><span class="letter">${o.letter}</span><span class="option-text">${safe(o.label)}</span></button>`;}).join('')}</div>${answered?`<div class="feedback ${right?'good':'bad'}" role="status"><div class="feedback-title">${right?'✅ RESPOSTA CORRETA!':'❌ RESPOSTA INCORRETA'}</div><p><strong>Gabarito: letra ${safe(q.correct)}.</strong></p><p>${safe(q.explanation)}</p></div>`:`<button type="button" class="primary confirm" id="confirm" ${chosen?'':'disabled'}>Confirmar resposta</button><p class="q-note">Escolha uma alternativa e toque em “Confirmar resposta”.</p>`}<a class="source" href="${safe(q.url)}" target="_blank" rel="noopener noreferrer">Ver questão original da banca ↗</a></article>`;}
function renderResults(){let s=score(),pct=Math.round(100*s/TOTAL);return `<article class="sheet results"><div class="result-icon">🏆</div><h2 style="text-align:center">Resultado do quiz</h2>${state.name?`<p style="text-align:center">Aluno(a): <strong>${safe(state.name)}</strong></p>`:''}<div class="score">${pct}%</div><div class="score-label">${s} acertos em ${TOTAL} questões</div><div class="score-breakdown"><div class="score-card"><b>${s}</b><span>✅ Acertos</span></div><div class="score-card red"><b>${TOTAL-s}</b><span>❌ Erros</span></div></div><div class="review-title">Revisar questão (toque no número):</div><div class="review-list">${QUESTIONS.map((q,j)=>`<button class="review-btn ${state.answers[q.number]===q.correct?'pass':'fail'}" type="button" data-review="${j}" title="Questão ${q.number}">${q.number}</button>`).join('')}</div><div class="result-actions"><button class="primary" type="button" id="retry">Refazer somente o quiz</button><button class="secondary" type="button" id="copy">Copiar meu resultado</button><button class="secondary" type="button" id="studyAgain">Rever a teoria</button></div><p class="hint-muted" style="text-align:center;margin-top:21px">Quem quer ser aprovado estuda.</p></article>`;}
function render(){document.title='Balanço Orçamentário • Tópico 01 | Professor Moreira';buttonSound();const area=document.getElementById('content');const status=document.getElementById('stageLabel');const idx=document.getElementById('stepLabel');let p=0; if(state.stage===0){area.innerHTML=renderCover();status.textContent='Apresentação';idx.textContent='Tópico 01';p=0;}else if(state.stage<=N){let i=state.stage-1;area.innerHTML=renderTheory(LESSONS[i],i);status.textContent='Estudo da teoria';idx.textContent=`${i+1} de ${N}`;p=100*state.stage/FINAL;}else if(state.stage<FINAL){let j=getQuestionIndex();let q=QUESTIONS[j];area.innerHTML=renderQuestion(q,j);status.textContent='Quiz de concursos';idx.textContent=`${j+1} de ${TOTAL}`;p=100*state.stage/FINAL;}else{area.innerHTML=renderResults();status.textContent='Quiz concluído';idx.textContent='Resultado';p=100;}document.getElementById('progressBar').style.width=p+'%';const prev=document.getElementById('prev'),next=document.getElementById('next');prev.disabled=state.stage===0;next.disabled=state.stage===FINAL||(state.stage>=FIRST&&state.stage<FINAL&&!completed(QUESTIONS[getQuestionIndex()]));next.textContent=state.stage===0?'Começar →':state.stage===N?'Ir para o quiz →':state.stage===FINAL?'Concluído ✓':state.stage===FINAL-1?'Ver resultado →':'Avançar →';save();bindContent();}
function go(n){state.stage=Math.max(0,Math.min(FINAL,n));render();scrollUp();}
function bindContent(){if(state.stage===0){document.getElementById('studentName').addEventListener('input',e=>{state.name=e.target.value;save();});document.getElementById('start').addEventListener('click',()=>go(1));document.getElementById('testSuccess').addEventListener('click',()=>sound(true));document.getElementById('testError').addEventListener('click',()=>sound(false));}
else if(state.stage>=FIRST&&state.stage<FINAL){const q=QUESTIONS[getQuestionIndex()];if(!completed(q)){document.querySelectorAll('[data-option]').forEach(btn=>btn.addEventListener('click',()=>{state.chosen[q.number]=btn.dataset.option;render();}));const confirm=document.getElementById('confirm');confirm.addEventListener('click',()=>{let val=state.chosen[q.number];if(!val)return;state.answers[q.number]=val;save();sound(val===q.correct);render();});}}
else if(state.stage===FINAL){document.querySelectorAll('[data-review]').forEach(btn=>btn.addEventListener('click',()=>go(FIRST+Number(btn.dataset.review))));document.getElementById('retry').addEventListener('click',()=>{if(confirm('Refazer o quiz? As respostas anteriores serão apagadas.')){state.answers={};state.chosen={};go(FIRST);}});document.getElementById('studyAgain').addEventListener('click',()=>go(1));document.getElementById('copy').addEventListener('click',async()=>{let result=`Curso de Contabilidade Professor Moreira\nBalanço Orçamentário — Tópico 01\nAluno(a): ${state.name||'Não informado'}\nResultado: ${score()} de ${TOTAL} acertos (${Math.round(score()*100/TOTAL)}%).`;try{await navigator.clipboard.writeText(result);alert('Resultado copiado!');}catch(e){prompt('Copie seu resultado:',result);}});}}
document.getElementById('soundToggle').addEventListener('click',()=>{state.soundOn=!state.soundOn;buttonSound();save();if(state.soundOn)sound(true);});document.getElementById('prev').addEventListener('click',()=>go(state.stage-1));document.getElementById('next').addEventListener('click',()=>{if(state.stage===FINAL)return;if(state.stage>=FIRST&&state.stage<FINAL&&!completed(QUESTIONS[getQuestionIndex()]))return;go(state.stage+1);});document.getElementById('restart').addEventListener('click',()=>{if(confirm('Reiniciar toda a aula e apagar as respostas do quiz?')){const soundOn=state.soundOn;state=defaultState();state.soundOn=soundOn;go(0);}});
load();render();
</script>
